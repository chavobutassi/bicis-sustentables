{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="login tarjeta">
  <h1>Ingresar</h1>
  <p class="sub">Acceso restringido al personal autorizado.</p>
  {% if error %}<p class="aviso-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <div class="campo"><label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" required maxlength="254"></div>
    <div class="campo"><label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required maxlength="200"></div>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
